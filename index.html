<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>ホワイトボード</title>
    <link rel="stylesheet" href="/src/client/styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="toolbar" aria-label="ツールバー">
        <div class="group" role="group" aria-label="ツール">
          <button type="button" data-tool="select">選択</button>
          <button type="button" data-tool="pen">ペン</button>
          <button type="button" data-tool="eraser">消しゴム</button>
          <button type="button" data-tool="text">文字</button>
        </div>

        <div class="group" role="group" aria-label="色">
          <button type="button" class="swatch" data-color="#111827" style="--swatch: #111827" aria-label="黒"></button>
          <button type="button" class="swatch" data-color="#dc2626" style="--swatch: #dc2626" aria-label="赤"></button>
          <button type="button" class="swatch" data-color="#2563eb" style="--swatch: #2563eb" aria-label="青"></button>
          <button type="button" class="swatch" data-color="#16a34a" style="--swatch: #16a34a" aria-label="緑"></button>
          <button type="button" class="swatch" data-color="#ca8a04" style="--swatch: #ca8a04" aria-label="黄"></button>
          <button type="button" class="swatch" data-color="#9333ea" style="--swatch: #9333ea" aria-label="紫"></button>
          <button type="button" class="swatch" data-color="#ea580c" style="--swatch: #ea580c" aria-label="橙"></button>
          <input type="color" id="color-input" value="#111827" aria-label="任意の色" />
        </div>

        <div class="group">
          <label>太さ
            <select id="width-select">
              <option value="2">細</option>
              <option value="4" selected>中</option>
              <option value="8">太</option>
              <option value="16">極太</option>
            </select>
          </label>
          <label>線種
            <select id="style-select">
              <option value="solid">実線</option>
              <option value="dashed">破線</option>
              <option value="dotted">点線</option>
            </select>
          </label>
        </div>

        <div class="group" role="group" aria-label="オブジェクト操作">
          <button type="button" id="multi-toggle" aria-pressed="false">複数選択</button>
          <button type="button" id="delete-btn" disabled>選択を削除</button>
          <button type="button" id="clear-btn">全消去</button>
        </div>

        <div class="group" role="group" aria-label="共有と保存">
          <button type="button" id="png-btn">PNG保存</button>
          <button type="button" id="share-btn">URLをコピー</button>
          <span id="share-message" class="share-message" role="status"></span>
          <span id="status" class="status" data-status="connecting">接続中…</span>
        </div>
      </header>

      <main id="stage">
        <canvas id="board"></canvas>
      </main>
    </div>
    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
